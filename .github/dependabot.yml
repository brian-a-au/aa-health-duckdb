# Dependabot opens pull requests that update the Python packages in
# uv.lock and the GitHub Actions in .github/workflows. It checks once a
# week and puts the minor and patch updates of each kind in one pull
# request. A major update gets its own pull request.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
